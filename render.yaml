services:
  - type: web
    name: prediteq-api
    runtime: python
    region: frankfurt          # closest to Tunisia
    plan: free                 # zero-cost demo hosting; Starter is smoother if you later upgrade
    # No rootDir - we need both prediteq_api/ AND prediteq_ml/ (models)
    buildCommand: pip install -r prediteq_api/requirements.txt
    startCommand: cd prediteq_api && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false            # set manually in Render dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EMAILJS_API_BASE
        value: "https://api.emailjs.com"
      - key: EMAILJS_PUBLIC_KEY
        sync: false            # no-phone HTTP email alternative
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: EMAILJS_SERVICE_ID
        value: "service_8pbpf55"
      - key: EMAILJS_TEMPLATE_ID
        value: "template_lk1gh6i"
      - key: BREVO_API_KEY
        sync: false            # free HTTPS email API (recommended on Render Free)
      - key: BREVO_SENDER_EMAIL
        sync: false            # verified sender email in Brevo
      - key: BREVO_SENDER_NAME
        value: "PrediTeq Alerts"
      - key: SMTP_HOST
        sync: false            # optional fallback if you later move off Render Free
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false            # sender email used by the backend
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false            # set to your Vercel domain(s)
      - key: DASHBOARD_URL
        sync: false            # frontend URL for email links
      - key: MQTT_BROKER
        value: ""              # empty = simulated mode
