name: Deployed Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: deployed-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prediteq_frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: prediteq_api/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: prediteq_frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke deployed frontend and backend
        env:
          FRONTEND_URL: https://prediteq-saas.vercel.app
          BACKEND_URL: https://prediteq-saas.onrender.com
          SMOKE_RETRIES: "12"
          SMOKE_DELAY_MS: "30000"
        run: npm run smoke:deployed

      - name: Install backend dependencies
        working-directory: prediteq_api
        run: pip install -r requirements.txt

      - name: Smoke deployed authenticated backend flow
        working-directory: prediteq_api
        env:
          BACKEND_URL: https://prediteq-saas.onrender.com
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Skipping live auth smoke because SUPABASE_URL / SUPABASE_SERVICE_KEY secrets are not configured."
            exit 0
          fi

          python scripts/live_auth_smoke.py --backend-url "$BACKEND_URL"
